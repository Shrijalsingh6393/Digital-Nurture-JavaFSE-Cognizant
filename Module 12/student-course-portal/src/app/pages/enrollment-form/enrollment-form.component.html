<div class="container">
  <h2>Student Enrollment Request (Template-Driven Form)</h2>

  <div *ngIf="submitted" class="success-banner">
    Enrollment request submitted successfully!
  </div>

  <form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)" class="form-card">
    
    <!-- Student Name -->
    <div class="form-group">
      <label for="studentName">Student Name *</label>
      <input
        type="text"
        id="studentName"
        name="studentName"
        ngModel
        #nameCtrl="ngModel"
        required
        minlength="3"
        class="form-control"
      >
      <div *ngIf="nameCtrl.touched && nameCtrl.errors" class="error-container">
        <span *ngIf="nameCtrl.errors['required']" class="error-text">Name is required.</span>
        <span *ngIf="nameCtrl.errors['minlength']" class="error-text">Name must be at least 3 characters.</span>
      </div>
    </div>

    <!-- Student Email -->
    <div class="form-group">
      <label for="studentEmail">Student Email *</label>
      <input
        type="email"
        id="studentEmail"
        name="studentEmail"
        ngModel
        #emailCtrl="ngModel"
        required
        email
        class="form-control"
      >
      <div *ngIf="emailCtrl.touched && emailCtrl.errors" class="error-container">
        <span *ngIf="emailCtrl.errors['required']" class="error-text">Email is required.</span>
        <span *ngIf="emailCtrl.errors['email']" class="error-text">Please enter a valid email address.</span>
      </div>
    </div>

    <!-- Course ID -->
    <div class="form-group">
      <label for="courseId">Course ID *</label>
      <input
        type="number"
        id="courseId"
        name="courseId"
        ngModel
        #courseCtrl="ngModel"
        required
        class="form-control"
      >
      <div *ngIf="courseCtrl.touched && courseCtrl.errors" class="error-container">
        <span *ngIf="courseCtrl.errors['required']" class="error-text">Course ID is required.</span>
      </div>
    </div>

    <!-- Preferred Semester -->
    <div class="form-group">
      <label for="preferredSemester">Preferred Semester</label>
      <select id="preferredSemester" name="preferredSemester" ngModel="Odd" class="form-control">
        <option value="Odd">Odd Semester</option>
        <option value="Even">Even Semester</option>
      </select>
    </div>

    <!-- Terms Checkbox -->
    <div class="form-group checkbox-group">
      <input
        type="checkbox"
        id="agreeToTerms"
        name="agreeToTerms"
        ngModel
        #termsCtrl="ngModel"
        required
      >
      <label for="agreeToTerms">I agree to academic policies & terms *</label>
      <div *ngIf="termsCtrl.touched && termsCtrl.errors" class="error-container">
        <span *ngIf="termsCtrl.errors['required']" class="error-text">You must agree to terms before submitting.</span>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="form-actions">
      <button type="submit" [disabled]="enrollForm.invalid" class="btn-primary">Submit Request</button>
      <button type="button" (click)="onReset(enrollForm)" class="btn-secondary">Reset</button>
    </div>
  </form>
</div>
