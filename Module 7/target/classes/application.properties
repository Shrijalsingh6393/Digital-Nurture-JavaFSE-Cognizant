# Enable H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Use H2 in‑memory database
spring.datasource.url=jdbc:h2:mem:ormlearndb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Show SQL statements in console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# DDL Auto: none (we will use schema.sql and data.sql for complete control)
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

# Disable web server for command-line runner execution
spring.main.web-application-type=none

